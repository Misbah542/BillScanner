# Everything that has to be true before a change lands.
#
# No secrets are needed to run any of this. The API tests use a throwaway Postgres
# service and the OCR stub; the Android build falls back to its committed defaults
# for the base URL and the Google client id. If you add a signing key or a real OCR
# provider later, those go in repository secrets — see docs/CI.md.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap and first: fail the whole run in seconds if something that must never be
  # committed has been committed.
  hygiene:
    name: Secrets and hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No env files, keys or keystores are tracked
        run: |
          set -euo pipefail
          # The *.example templates are the only allowed matches: they hold
          # placeholders and are what a new checkout copies from.
          offenders=$(git ls-files \
            | grep -iE '(^|/)\.env($|\.)|(^|/)local\.properties$|\.(pem|p12|jks|keystore)$|google-services\.json$|(^|/)key\.properties$' \
            | grep -vE '\.example$' \
            || true)
          if [ -n "$offenders" ]; then
            echo "::error::These must not be in the repository:"
            echo "$offenders" | sed 's/^/  /'
            exit 1
          fi
          echo "clean"

      - name: No real secret values in the committed templates
        run: |
          set -euo pipefail
          # A template's job is to name the variable, not to carry a value. Anything
          # long and high-entropy in one is a leak that looks like documentation.
          if grep -nEi '^[A-Z_]*(SECRET|KEY|TOKEN|PASSWORD)[A-Z_]*=[A-Za-z0-9+/=_-]{24,}' apps/api/.env.example apps/api/.env.test.example \
             | grep -viE 'change-me|dev-only|your-|example|placeholder'; then
            echo "::error file=apps/api/.env.example::This looks like a real value, not a placeholder."
            exit 1
          fi
          echo "templates hold placeholders only"

  js:
    name: Shared + API
    runs-on: ubuntu-latest
    needs: hygiene

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: snaptab
          POSTGRES_PASSWORD: snaptab
          POSTGRES_DB: snaptab_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U snaptab -d snaptab_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://snaptab:snaptab@localhost:5432/snaptab_test?schema=public
      # Not a secret: a throwaway value for a throwaway database in a throwaway
      # container. The real one lives in the deployment's environment.
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-ci
      OCR_PROVIDER: stub
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: .storage-ci
      LOG_LEVEL: silent
      PUBLIC_BASE_URL: http://localhost:4000
      APP_SHARE_BASE_URL: http://localhost:4000/t

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build the shared package
        run: npm run build --workspace @snaptab/shared

      - name: Generate the Prisma client
        # Before the typecheck, not after. `@prisma/client` ships as a stub whose
        # types are written by `prisma generate` from schema.prisma; until that has
        # run, every Prisma.<Model>Select and every transaction callback parameter is
        # missing or untyped, and tsc reports ~60 errors that have nothing to do with
        # the code. This is the step whose absence produced exactly that.
        run: npm run db:generate --workspace @snaptab/api

      - name: Shared rule files are in sync with the app's assets
        run: |
          set -euo pipefail
          npm run sync:assets
          # The Kotlin and TypeScript parsers read the same tables. If these have
          # drifted, the same bank SMS gets two different fingerprints and the user
          # sees it twice — so a stale asset is a build failure, not a warning.
          if ! git diff --quiet -- apps/android/app/src/main/assets/shared; then
            echo "::error::Shared rule data changed without running 'npm run sync:assets'."
            git --no-pager diff --stat -- apps/android/app/src/main/assets/shared
            exit 1
          fi

      - run: npm run typecheck

      - name: Apply the migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Shared tests
        run: npm run test --workspace @snaptab/shared

      - name: API tests
        run: npm run test --workspace @snaptab/api

  android:
    name: Android
    runs-on: ubuntu-latest
    needs: hygiene

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Shared rule assets
        run: npm ci && npm run sync:assets

      - uses: android-actions/setup-android@v3
        with:
          # The action defaults to installing `tools platform-tools`, and Google
          # removed the obsolete `tools` package from its repository, so the default
          # fails with "Failed to find package 'tools'" before anything is built.
          # Naming what the build actually needs avoids it: compileSdk 35, and the
          # build-tools version AGP 8.7.3 pins.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # No build-root-directory: v4 removed that input, and passing it only produces a
      # warning. Each Gradle step sets its own working-directory instead. The action's
      # wrapper validation, which is on by default, checks gradle-wrapper.jar against
      # the published checksums — worth keeping, since that jar is executable code
      # committed to the repository.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDemoDebugUnitTest testLiveDebugUnitTest
        working-directory: apps/android

      - name: Lint
        run: ./gradlew lintDemoDebug
        working-directory: apps/android

      - name: Build the demo APK
        run: ./gradlew assembleDemoDebug
        working-directory: apps/android

      - name: Upload the demo APK
        uses: actions/upload-artifact@v4
        with:
          name: snaptab-demo-debug
          # Installable with `adb install -r <file>`. It talks to no server at all —
          # every screen is served by the in-memory fake API, and the flavour has no
          # SMS permissions in its manifest.
          path: apps/android/app/build/outputs/apk/demo/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # The release variant is where R8 runs, and R8 is where a missing keep rule
      # turns into an APK that installs and then fails on its first API call. Building
      # the demo release exercises the whole shrink-and-obfuscate path on every push,
      # and needs no signing key and no API address to do it.
      - name: Build the demo release APK (exercises R8)
        run: ./gradlew assembleDemoRelease
        working-directory: apps/android

      - name: Upload the demo release APK
        uses: actions/upload-artifact@v4
        with:
          name: snaptab-demo-release-unsigned
          # Unsigned, so it cannot be installed — it is here to be inspected, and as
          # proof the minified build works. Sign a release before handing it out.
          path: apps/android/app/build/outputs/apk/demo/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/**
            apps/android/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14
