# Builds a signed release you can hand out.
#
# Run it from the Actions tab, or push a tag like v0.1.0.
#
# This is separate from ci.yml on purpose. CI runs on every push and must never need a
# secret; this one touches the signing key, so it runs only when asked, and only on
# refs a maintainer chose.
name: Release

on:
  workflow_dispatch:
    inputs:
      flavour:
        description: 'Which app to build'
        type: choice
        default: demo
        options:
          - demo   # no server, no signing key needed, safe to post anywhere
          - live   # talks to your API; needs the signing secrets below
      artifact:
        description: 'APK (sideload / direct download) or AAB (Play Store)'
        type: choice
        default: apk
        options: [apk, aab]
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest

    env:
      FLAVOUR: ${{ inputs.flavour || 'live' }}
      ARTIFACT: ${{ inputs.artifact || 'aab' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Shared rule assets
        run: npm ci && npm run sync:assets

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # No build-root-directory: v4 removed that input, and passing it only produces a
      # warning. Each Gradle step sets its own working-directory instead. The action's
      # wrapper validation, which is on by default, checks gradle-wrapper.jar against
      # the published checksums — worth keeping, since that jar is executable code
      # committed to the repository.
      - uses: gradle/actions/setup-gradle@v4

      # Say what is missing before spending ten minutes building something that cannot
      # be signed at the end of it.
      - name: Check the signing secrets are present
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_URL: ${{ secrets.ANDROID_RELEASE_API_BASE_URL }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$KEYSTORE" ]       || missing+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$STORE_PASSWORD" ] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ]      || missing+=(ANDROID_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ]   || missing+=(ANDROID_KEY_PASSWORD)
          if [ "$FLAVOUR" = "live" ] && [ -z "$RELEASE_URL" ]; then
            missing+=(ANDROID_RELEASE_API_BASE_URL)
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "### Release build needs these repository secrets"
              echo
              for m in "${missing[@]}"; do echo "- \`$m\`"; done
              echo
              echo "Add them under Settings → Secrets and variables → Actions."
              echo "See [docs/CI.md](docs/CI.md#what-a-live-release-needs) for how to"
              echo "generate a keystore and base64 it."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing secrets: ${missing[*]}"
            exit 1
          fi

      # Written to the runner's temp dir, which is destroyed with the runner. Never
      # into the workspace, where a later step could archive it into an artifact.
      - name: Decode the keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Size only. Never the contents, and never a password, into the log.
          echo "keystore decoded: $(stat -c%s "$RUNNER_TEMP/release.jks") bytes"

      - name: Build
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_RELEASE_API_BASE_URL: ${{ secrets.ANDROID_RELEASE_API_BASE_URL }}
        run: |
          set -euo pipefail
          # demo -> Demo, live -> Live
          variant="$(printf '%s' "${FLAVOUR:0:1}" | tr '[:lower:]' '[:upper:]')${FLAVOUR:1}Release"
          if [ "$ARTIFACT" = "aab" ]; then
            ./gradlew "bundle${variant}"
          else
            ./gradlew "assemble${variant}"
          fi
        working-directory: apps/android

      - name: Confirm it is actually signed
        run: |
          set -euo pipefail
          # A release that silently came out unsigned is the failure this whole workflow
          # exists to prevent, so it is checked rather than assumed.
          file=$(find apps/android/app/build/outputs -name '*.apk' -o -name '*.aab' | head -1)
          echo "built: $file"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          case "$file" in
            *.apk)
              "$apksigner" verify --print-certs "$file" | grep -E 'Signer #1 certificate (DN|SHA-256)'
              ;;
            *.aab)
              # An AAB is a signed zip; jarsigner is what reads that signature.
              jarsigner -verify "$file" | tail -2
              ;;
          esac

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: snaptab-${{ env.FLAVOUR }}-release
          path: |
            apps/android/app/build/outputs/apk/**/release/*.apk
            apps/android/app/build/outputs/bundle/**/*.aab
            apps/android/app/build/outputs/mapping/**/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        run: |
          {
            echo "### SnapTab ${FLAVOUR} release"
            echo
            echo "Built \`${ARTIFACT}\` from \`${GITHUB_SHA::7}\`."
            echo
            if [ "$FLAVOUR" = "demo" ]; then
              echo "This is the demo build: no server, no SMS permissions, sample data only."
            else
              echo "This talks to the API in \`ANDROID_RELEASE_API_BASE_URL\`."
            fi
            echo
            echo "\`mapping.txt\` is in the artifact — keep it, it is the only way to read"
            echo "a stack trace from this build."
          } >> "$GITHUB_STEP_SUMMARY"
